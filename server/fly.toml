# fly.toml — deploy with `fly launch --no-deploy` first (to register the app),
# then `fly deploy`. Replace the app name below with whatever you registered.
#
# Free-tier-friendly settings: 1 shared-cpu VM, 256 MB RAM, suspend when idle.
# `auto_stop_machines = "suspend"` keeps the VM's process memory frozen rather
# than fully stopping, so cold start on the next WebSocket connect is ~1-2s
# instead of ~5s.
#
# Once deployed, the client connects to:
#   wss://<app-name>.fly.dev/ws?name=<display-name>
# Single global room — no codes, no passwords.

app = "the-rift-draft-sync"
primary_region = "iad"   # change to a region near you/your friends

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

# Phase 0d — persistent volume for the SQLite match store (server/db.py).
# Create it once, before the first deploy with this config:
#   fly volumes create rift_data --region iad --size 1
[mounts]
  source = "rift_data"
  destination = "/data"
